    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        function showAuthLoading(show) {
            const loading = document.getElementById('auth-loading');
            const loginForm = document.getElementById('login-form');
            
            if (show) {
                loading.classList.remove('hidden');
                loginForm.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        async function signInWithGitHub() {
            showAuthLoading(true);

            try {
                // Try signInWithOAuth first (newer versions)
                let result;
                if (typeof SupabaseClient.auth.signInWithOAuth === 'function') {
                    result = await SupabaseClient.auth.signInWithOAuth({
                        provider: 'github',
                        options: {
                            redirectTo: `${window.location.origin}/app.html`
                        }
                    });
                } else if (typeof SupabaseClient.auth.signInWithOAuth2 === 'function') {
                    // Fallback to signInWithOAuth2 (older versions)
                    result = await SupabaseClient.auth.signInWithOAuth2({
                        provider: 'github',
                        options: {
                            redirectTo: `${window.location.origin}/app.html`
                        }
                    });
                } else {
                    throw new Error('OAuth authentication not available');
                }

                const { data, error } = result;

                if (error) throw error;

                // Supabase will handle the redirect
            } catch (error) {
                console.error('GitHub sign in error:', error);
                alert('GitHub sign in failed: ' + error.message);
                showAuthLoading(false);
            }
        }

        // Check if user is already logged in
        async function checkExistingSession() {
            try {
                const { data: { session } } = await SupabaseClient.auth.getSession();
                if (session) {
                    // Already logged in, redirect to app
                    window.location.href = '/app.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        // Initialize session check
        checkExistingSession();
    </script>
