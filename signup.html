<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlehat - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SupabaseClient = supabase.createClient('https://slswhyrlxivgndwswiqg.supabase.co', 'sb_publishable_VY4MGCaxKL1_guVdpz4_Hw_Wz6ju4-v');
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-zinc-900 antialiased min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Left Side - Image -->
        <div class="w-full md:w-1/2 relative overflow-hidden">
            <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1920&q=80" alt="Technology background" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-br from-zinc-900/90 to-zinc-800/80"></div>
            <div class="relative z-10 h-full flex items-center justify-center p-8">
                <div class="text-center">
                    <div class="w-24 h-24 rounded-2xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center text-white font-bold shadow-2xl mx-auto mb-8 border border-zinc-600">
                        <i data-lucide="shield" class="w-12 h-12 text-accent-400"></i>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Castlehat</h1>
                    <p class="text-zinc-300 text-base md:text-lg leading-relaxed mb-8">Secure VM Sandbox Platform</p>
                    <div class="grid grid-cols-3 gap-6 max-w-sm mx-auto">
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="cpu" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Hardware KVM</p>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="shield-alert" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Air-Gapped</p>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="refresh-cw" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Instant Revert</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Signup Form -->
        <div class="w-full md:w-1/2 bg-white p-8 md:p-16 flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="text-3xl font-semibold text-zinc-900 mb-2">Create your account</h2>
                <p class="text-base text-zinc-600">Sign up with GitHub to start your secure VM workspace experience</p>
            </div>

            <!-- Loading State -->
            <div id="auth-loading" class="hidden text-center py-12">
                <div class="inline-flex items-center space-x-3 text-base text-zinc-600">
                    <div class="w-8 h-8 border-2 border-zinc-300 border-t-accent-600 rounded-full animate-spin"></div>
                    <span>Connecting to GitHub...</span>
                </div>
            </div>

            <!-- GitHub Signup Form -->
            <div id="signup-form">
                <div class="space-y-6">
                    <button onclick="signUpWithGitHub()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-base font-medium py-4 rounded-lg transition-colors shadow-md flex items-center justify-center space-x-3">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <span>Sign up with GitHub</span>
                    </button>
                </div>

                <div class="mt-8 text-center">
                    <p class="text-base text-zinc-600">
                        Already have a GitHub account? 
                        <a href="/login.html" class="text-accent-600 hover:text-accent-700 font-medium">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        function showAuthLoading(show) {
            const loading = document.getElementById('auth-loading');
            const signupForm = document.getElementById('signup-form');
            
            if (show) {
                loading.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        }

        async function signUpWithGitHub() {
            showAuthLoading(true);

            try {
                const { data, error } = await SupabaseClient.auth.signInWithOAuth2({
                    provider: 'github',
                    options: {
                        redirectTo: `${window.location.origin}/app.html`
                    }
                });

                if (error) throw error;

                // Supabase will handle the redirect
            } catch (error) {
                console.error('GitHub sign up error:', error);
                alert('GitHub sign up failed: ' + error.message);
                showAuthLoading(false);
            }
        }

        // Check if user is already logged in
        async function checkExistingSession() {
            try {
                const { data: { session } } = await SupabaseClient.auth.getSession();
                if (session) {
                    // Already logged in, redirect to app
                    window.location.href = '/app.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        // Initialize session check
        checkExistingSession();
    </script>
</body>
</html>
