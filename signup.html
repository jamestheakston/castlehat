<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlehat - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SupabaseClient = supabase.createClient('https://slswhyrlxivgndwswiqg.supabase.co', 'sb_publishable_VY4MGCaxKL1_guVdpz4_Hw_Wz6ju4-v');
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-zinc-900 antialiased min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Left Side - Image -->
        <div class="w-full md:w-1/2 relative overflow-hidden">
            <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1920&q=80" alt="Technology background" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-br from-zinc-900/90 to-zinc-800/80"></div>
            <div class="relative z-10 h-full flex items-center justify-center p-8">
                <div class="text-center">
                    <div class="w-24 h-24 rounded-2xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center text-white font-bold shadow-2xl mx-auto mb-8 border border-zinc-600">
                        <i data-lucide="shield" class="w-12 h-12 text-accent-400"></i>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Castlehat</h1>
                    <p class="text-zinc-300 text-base md:text-lg leading-relaxed mb-8">Secure VM Sandbox Platform</p>
                    <div class="grid grid-cols-3 gap-6 max-w-sm mx-auto">
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="cpu" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Hardware KVM</p>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="shield-alert" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Air-Gapped</p>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 rounded-xl bg-zinc-700/50 backdrop-blur-sm flex items-center justify-center mx-auto mb-2 border border-zinc-600">
                                <i data-lucide="refresh-cw" class="w-8 h-8 text-accent-400"></i>
                            </div>
                            <p class="text-xs text-zinc-400">Instant Revert</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Signup Form -->
        <div class="w-full md:w-1/2 bg-white p-8 md:p-16 flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="text-3xl font-semibold text-zinc-900 mb-2">Create your account</h2>
                <p class="text-base text-zinc-600">Start your secure VM workspace experience</p>
            </div>

            <!-- Loading State -->
            <div id="auth-loading" class="hidden text-center py-12">
                <div class="inline-flex items-center space-x-3 text-base text-zinc-600">
                    <div class="w-8 h-8 border-2 border-zinc-300 border-t-accent-600 rounded-full animate-spin"></div>
                    <span>Creating account...</span>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signup-form">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Email address</label>
                        <input type="email" id="signup-email" placeholder="you@example.com" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-4 py-4 text-base text-zinc-900 focus:outline-none focus:border-accent-600 focus:ring-1 focus:ring-accent-600 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Password</label>
                        <input type="password" id="signup-password" placeholder="••••••••" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-4 py-4 text-base text-zinc-900 focus:outline-none focus:border-accent-600 focus:ring-1 focus:ring-accent-600 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Confirm password</label>
                        <input type="password" id="signup-confirm-password" placeholder="••••••••" class="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-4 py-4 text-base text-zinc-900 focus:outline-none focus:border-accent-600 focus:ring-1 focus:ring-accent-600 transition-colors">
                    </div>
                    <div class="flex items-start">
                        <input type="checkbox" id="terms-checkbox" class="w-4 h-4 text-accent-600 border-zinc-300 rounded focus:ring-accent-600 mt-1">
                        <label for="terms-checkbox" class="ml-2 text-sm text-zinc-600">
                            I agree to the <a href="#" class="text-accent-600 hover:text-accent-700">Terms of Service</a> and <a href="#" class="text-accent-600 hover:text-accent-700">Privacy Policy</a>
                        </label>
                    </div>
                    <button onclick="signUp()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-base font-medium py-4 rounded-lg transition-colors shadow-md">
                        Create Account
                    </button>
                </div>

                <div class="mt-8 text-center">
                    <p class="text-base text-zinc-600">
                        Already have an account? 
                        <a href="/login.html" class="text-accent-600 hover:text-accent-700 font-medium">Sign in</a>
                    </p>
                </div>
            </div>

            <!-- Success Message -->
            <div id="success-message" class="hidden text-center py-12">
                <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="mail" class="w-10 h-10 text-green-600"></i>
                </div>
                <h3 class="text-xl font-semibold text-zinc-900 mb-2">Check your email</h3>
                <p class="text-base text-zinc-600 mb-4">We've sent you a confirmation link to activate your account.</p>
                <button onclick="window.location.href='/login.html'" class="text-accent-600 hover:text-accent-700 font-medium text-base">
                    Go to sign in
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        function showAuthLoading(show) {
            const loading = document.getElementById('auth-loading');
            const signupForm = document.getElementById('signup-form');
            
            if (show) {
                loading.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
                signupForm.classList.remove('hidden');
            }
        }

        async function signUp() {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            const termsCheckbox = document.getElementById('terms-checkbox');
            
            if (!email || !password || !confirmPassword) {
                alert('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (!termsCheckbox.checked) {
                alert('Please agree to the Terms of Service and Privacy Policy');
                return;
            }

            showAuthLoading(true);

            try {
                const { data, error } = await SupabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user && !data.session) {
                    // Email confirmation required
                    document.getElementById('signup-form').classList.add('hidden');
                    document.getElementById('success-message').classList.remove('hidden');
                } else if (data.session) {
                    // Auto sign-in (if email confirmation is disabled)
                    window.location.href = '/app.html';
                }
            } catch (error) {
                console.error('Sign up error:', error);
                alert('Sign up failed: ' + error.message);
                showAuthLoading(false);
            }
        }

        // Check if user is already logged in
        async function checkExistingSession() {
            try {
                const { data: { session } } = await SupabaseClient.auth.getSession();
                if (session) {
                    // Already logged in, redirect to app
                    window.location.href = '/app.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

        // Initialize session check
        checkExistingSession();
    </script>
</body>
</html>
