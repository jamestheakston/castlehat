<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlehat - Secure VM Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script>
        const SupabaseClient = supabase.createClient('https://slswhyrlxivgndwswiqg.supabase.co', 'sb_publishable_VY4MGCaxKL1_guVdpz4_Hw_Wz6ju4-v');
        
        // QEMU WebAssembly Configuration
        const QEMU_CONFIG = {
            // Using ktock/qemu-wasm demo infrastructure
            demoUrl: 'https://ktock.github.io/qemu-wasm-demo/',
            wasmUrl: 'https://ktock.github.io/qemu-wasm-demo/alpine-x86_64/',
            defaultProfile: 'linux-x86_64-pc-graphics',
            memory: '512M',
            cpus: 2
        };
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .file-drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .file-drop-zone:hover, .file-drop-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .kasm-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
        }
        #qemu-canvas {
            image-rendering: pixelated;
        }
        #terminal {
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-white text-zinc-900 antialiased selection:bg-accent-100 selection:text-accent-900 min-h-screen flex flex-col">

    <header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-zinc-100">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-6 h-6 rounded-md bg-zinc-900 flex items-center justify-center text-white font-bold shadow-sm">
                    <i data-lucide="shield" class="w-3.5 h-3.5 text-accent-400"></i>
                </div>
                <span class="font-medium tracking-tight text-zinc-900 text-sm">Castlehat Workspace</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <a href="/login.html" class="text-xs font-medium text-zinc-600 hover:text-zinc-900 transition-colors">Sign In</a>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-32 px-6">
        <div class="max-w-3xl mx-auto">
            <!-- User Info Section -->
            <div id="user-info" class="mb-8 hidden">
                <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-6">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-accent-100 flex items-center justify-center">
                                <i data-lucide="user" class="w-5 h-5 text-accent-600"></i>
                            </div>
                            <div>
                                <p class="text-xs text-zinc-600">Signed in as</p>
                                <p class="text-sm font-medium text-zinc-900" id="auth-user-email"></p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div id="email-verification-badge" class="hidden">
                                <span class="inline-flex items-center px-2 py-1 rounded-full bg-amber-50 text-amber-700 text-xs">
                                    <i data-lucide="alert-circle" class="w-3 h-3 mr-1"></i>
                                    Unverified
                                </span>
                            </div>
                            <button onclick="logout()" class="text-xs font-medium text-zinc-600 hover:text-zinc-900 transition-colors">Sign Out</button>
                        </div>
                    </div>
                    <button onclick="resendVerificationEmail()" id="resend-verification-btn" class="hidden mt-3 w-full text-xs text-accent-600 hover:text-accent-700">Resend verification email</button>
                </div>
            </div>

            <!-- File Upload Section -->
            <div id="upload-section" class="mb-8 hidden">
                <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-6">
                    <h2 class="text-sm font-semibold text-zinc-900 mb-4">Upload Files for VM Analysis</h2>
                    
                    <div id="drop-zone" class="file-drop-zone rounded-lg p-8 text-center cursor-pointer mb-4">
                        <i data-lucide="upload-cloud" class="w-8 h-8 text-zinc-400 mx-auto mb-3"></i>
                        <p class="text-xs text-zinc-600 mb-2">Drag and drop files here or click to browse</p>
                        <p class="text-xs text-zinc-400">Support for executables, scripts, and archives</p>
                        <input type="file" id="file-input" class="hidden" multiple>
                    </div>
                    
                    <div id="file-list" class="space-y-2 mb-4"></div>
                    
                    <button onclick="uploadFiles()" id="upload-btn" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-2 rounded-md transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Upload Files
                    </button>
                </div>
            </div>

            <!-- VM Session Section -->
            <div id="vm-section" class="mb-8 hidden">
                <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-6">
                    <h2 class="text-sm font-semibold text-zinc-900 mb-4">Browser-based VM (QEMU WebAssembly)</h2>
                    
                    <div id="vm-controls" class="mb-4">
                        <div class="mb-3">
                            <label class="text-xs text-zinc-600 mb-1 block">Select Pre-configured VM Image</label>
                            <select id="qemu-profile" class="w-full bg-white border border-zinc-200 rounded-md px-3 py-2 text-xs text-zinc-900 focus:outline-none focus:border-accent-600 transition-colors">
                                <option value="alpine-linux">Alpine Linux (Secure)</option>
                                <option value="ubuntu-minimal">Ubuntu Minimal (Analysis)</option>
                                <option value="kali-linux">Kali Linux (Security Testing)</option>
                                <option value="fedora-workstation">Fedora Workstation (Development)</option>
                            </select>
                        </div>
                        
                        <button onclick="launchQemuVM()" id="launch-btn" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-2 rounded-md transition-colors shadow-sm">
                            Launch Secure VM
                        </button>
                    </div>
                    
                    <div id="session-status" class="hidden mb-4">
                        <div class="flex items-center space-x-2 text-xs text-zinc-600">
                            <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
                            <span id="status-text">Initializing QEMU WebAssembly...</span>
                        </div>
                    </div>
                    
                    <div id="qemu-container" class="hidden">
                        <div id="qemu-display" class="w-full h-[600px] bg-black rounded-lg overflow-hidden relative">
                            <div id="qemu-iframe-container" class="w-full h-full">
                                <iframe id="qemu-iframe" class="w-full h-full border-0" allow="cross-origin-isolated"></iframe>
                            </div>
                            <div id="qemu-terminal" class="absolute top-2 right-2 w-96 h-48 bg-zinc-900 rounded-lg shadow-lg hidden z-10">
                                <div class="flex items-center justify-between bg-zinc-800 px-3 py-1 rounded-t-lg">
                                    <span class="text-xs text-zinc-300">Terminal</span>
                                    <button onclick="toggleTerminal()" class="text-zinc-400 hover:text-white">
                                        <i data-lucide="x" class="w-3 h-3"></i>
                                    </button>
                                </div>
                                <div id="terminal" class="h-40 p-2"></div>
                            </div>
                        </div>
                        <div class="flex space-x-2 mt-3">
                            <button onclick="toggleTerminal()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-medium py-2 rounded-md transition-colors shadow-sm">
                                Toggle Terminal
                            </button>
                            <button onclick="restartVM()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium py-2 rounded-md transition-colors shadow-sm">
                                Restart VM
                            </button>
                            <button onclick="closeVM()" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-medium py-2 rounded-md transition-colors shadow-sm">
                                Close VM
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Uploaded Files Section -->
            <div id="uploaded-files-section" class="mb-8 hidden">
                <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-6">
                    <h2 class="text-sm font-semibold text-zinc-900 mb-4">Uploaded Files</h2>
                    <div id="uploaded-files-list" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        let selectedFiles = [];
        let currentUser = null;
        let currentSessionId = null;

        // Check for existing session on page load and redirect if not authenticated
        async function checkExistingSession() {
            try {
                const { data: { session } } = await SupabaseClient.auth.getSession();
                if (!session) {
                    // No session, redirect to login
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
                window.location.href = '/login.html';
            }
        }

        // Initialize session check
        checkExistingSession();

        // Authentication functions
        async function logout() {
            try {
                await SupabaseClient.auth.signOut();
                // Redirect to login page
                window.location.href = '/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Logout failed: ' + error.message);
            }
        }

        async function resendVerificationEmail() {
            if (!currentUser) return;
            
            try {
                const { error } = await SupabaseClient.auth.resend({
                    type: 'signup',
                    email: currentUser.email
                });
                
                if (error) throw error;
                
                alert('Verification email resent! Check your inbox.');
            } catch (error) {
                console.error('Resend verification error:', error);
                alert('Failed to resend verification email: ' + error.message);
            }
        }

        // Auth state change listener
        SupabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('Auth state changed:', event, session);
            
            if (event === 'SIGNED_IN' && session) {
                currentUser = session.user;
                const userEmail = session.user.email;
                
                // Update UI for logged in state
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('auth-user-email').textContent = userEmail;
                document.getElementById('upload-section').classList.remove('hidden');
                document.getElementById('vm-section').classList.remove('hidden');
                
                // Check email verification
                const emailVerified = session.user.email_confirmed_at;
                const verificationBadge = document.getElementById('email-verification-badge');
                const resendBtn = document.getElementById('resend-verification-btn');
                
                if (!emailVerified) {
                    verificationBadge.classList.remove('hidden');
                    resendBtn.classList.remove('hidden');
                } else {
                    verificationBadge.classList.add('hidden');
                    resendBtn.classList.add('hidden');
                }
                
                loadUploadedFiles();
                
            } else if (event === 'SIGNED_OUT') {
                currentUser = null;
                
                // Redirect to login page
                window.location.href = '/login.html';
                
                showAuthLoading(false);
            }
        });

        // File upload functions
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            updateFileList();
            document.getElementById('upload-btn').disabled = selectedFiles.length === 0;
        }

        function updateFileList() {
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="flex items-center justify-between bg-white border border-zinc-200 rounded-md px-3 py-2">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="file" class="w-4 h-4 text-zinc-400"></i>
                        <span class="text-xs text-zinc-700">${file.name}</span>
                        <span class="text-xs text-zinc-400">(${formatFileSize(file.size)})</span>
                    </div>
                    <button onclick="removeFile(${index})" class="text-zinc-400 hover:text-red-600">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            document.getElementById('upload-btn').disabled = selectedFiles.length === 0;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function uploadFiles() {
            if (selectedFiles.length === 0 || !currentUser) return;

            const uploadBtn = document.getElementById('upload-btn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            try {
                // Upload files to Supabase storage using user ID for better organization
                for (const file of selectedFiles) {
                    const fileName = `${currentUser.id}/${Date.now()}_${file.name}`;
                    const { data, error } = await SupabaseClient.storage
                        .from('uploaded-files')
                        .upload(fileName, file);

                    if (error) throw error;
                }

                alert('Files uploaded successfully');
                selectedFiles = [];
                updateFileList();
                loadUploadedFiles();
            } catch (error) {
                console.error('Upload error:', error);
                alert('Upload failed: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload Files';
            }
        }

        async function loadUploadedFiles() {
            if (!currentUser) return;

            try {
                const { data, error } = await SupabaseClient.storage
                    .from('uploaded-files')
                    .list(currentUser.id, {
                        limit: 100,
                        offset: 0,
                        sortBy: { column: 'created_at', order: 'desc' }
                    });

                if (error) throw error;

                const uploadedFilesSection = document.getElementById('uploaded-files-section');
                const uploadedFilesList = document.getElementById('uploaded-files-list');

                if (data && data.length > 0) {
                    uploadedFilesSection.classList.remove('hidden');
                    uploadedFilesList.innerHTML = data.map(file => `
                        <div class="flex items-center justify-between bg-white border border-zinc-200 rounded-md px-3 py-2">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="file" class="w-4 h-4 text-zinc-400"></i>
                                <span class="text-xs text-zinc-700">${file.name}</span>
                                <span class="text-xs text-zinc-400">(${formatFileSize(file.metadata?.size || 0)})</span>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="downloadFile('${file.name}')" class="text-xs text-accent-600 hover:text-accent-700">
                                    Download
                                </button>
                                <button onclick="deleteFile('${file.name}')" class="text-xs text-red-600 hover:text-red-700">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `).join('');
                    lucide.createIcons();
                } else {
                    uploadedFilesSection.classList.add('hidden');
                }
            } catch (error) {
                console.error('Load files error:', error);
            }
        }

        async function downloadFile(fileName) {
            try {
                const { data, error } = await SupabaseClient.storage
                    .from('uploaded-files')
                    .download(`${currentUser.id}/${fileName}`);

                if (error) throw error;

                const url = URL.createObjectURL(data);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Download error:', error);
                alert('Download failed');
            }
        }

        async function deleteFile(fileName) {
            if (!confirm('Are you sure you want to delete this file?')) return;
            
            try {
                const { error } = await SupabaseClient.storage
                    .from('uploaded-files')
                    .remove([`${currentUser.id}/${fileName}`]);

                if (error) throw error;

                alert('File deleted successfully');
                loadUploadedFiles();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Delete failed: ' + error.message);
            }
        }

        // QEMU WebAssembly functions
        let qemuInstance = null;
        let term = null;
        let fitAddon = null;

        async function launchQemuVM() {
            const profile = document.getElementById('qemu-profile').value;

            const launchBtn = document.getElementById('launch-btn');
            const sessionStatus = document.getElementById('session-status');
            const statusText = document.getElementById('status-text');

            launchBtn.disabled = true;
            sessionStatus.classList.remove('hidden');
            statusText.textContent = 'Loading QEMU WebAssembly...';

            try {
                // Load QEMU WebAssembly from ktock/qemu-wasm demo
                await loadQemuDemo(profile);
                
                statusText.textContent = 'VM started successfully';
                setTimeout(() => {
                    sessionStatus.classList.add('hidden');
                }, 2000);

            } catch (error) {
                console.error('QEMU launch error:', error);
                statusText.textContent = 'Failed to launch VM: ' + error.message;
                launchBtn.disabled = false;
            }
        }

        async function loadQemuDemo(profile, diskImage) {
            const qemuContainer = document.getElementById('qemu-container');
            const qemuIframe = document.getElementById('qemu-iframe');
            const statusText = document.getElementById('status-text');
            
            // Map profile names to ktock/qemu-wasm demo URLs
            const profileUrls = {
                'alpine-linux': 'https://ktock.github.io/qemu-wasm-demo/alpine-x86_64.html',
                'ubuntu-minimal': 'https://ktock.github.io/qemu-wasm-demo/alpine-x86_64.html', // Using Alpine as placeholder
                'kali-linux': 'https://ktock.github.io/qemu-wasm-demo/alpine-x86_64.html', // Using Alpine as placeholder
                'fedora-workstation': 'https://ktock.github.io/qemu-wasm-demo/alpine-x86_64.html' // Using Alpine as placeholder
            };
            
            const demoUrl = profileUrls[profile] || profileUrls['alpine-linux'];
            
            // Set up message handler for communication with QEMU
            window.addEventListener('message', handleQemuMessage);
            
            // Load the demo in iframe
            qemuIframe.src = demoUrl;
            
            // Initialize terminal
            initTerminal();
            
            // Show container
            document.getElementById('session-status').classList.add('hidden');
            qemuContainer.classList.remove('hidden');
            
            // Wait for iframe to load
            qemuIframe.onload = function() {
                console.log('QEMU demo loaded');
                statusText.textContent = 'QEMU environment ready';
            };
        }

        function handleQemuMessage(event) {
            // Handle messages from QEMU iframe
            if (event.data && event.data.type === 'qemu-output') {
                if (term) {
                    term.write(event.data.output);
                }
            }
        }

        function initTerminal() {
            const terminalElement = document.getElementById('terminal');
            
            // Initialize xterm.js
            term = new Terminal({
                cursorBlink: true,
                fontSize: 12,
                fontFamily: 'Courier New, monospace',
                theme: {
                    background: '#1a1a1a',
                    foreground: '#00ff00',
                    cursor: '#00ff00'
                }
            });
            
            // Load fit addon
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            
            // Open terminal
            term.open(terminalElement);
            fitAddon.fit();
            
            // Welcome message
            term.writeln('QEMU WebAssembly Terminal');
            term.writeln('========================');
            term.writeln('VM is running in the iframe above.');
            term.writeln('This terminal can be used for additional commands.');
            term.writeln('');
            
            // Handle terminal input
            term.onData(data => {
                // For demo purposes, just echo the input
                term.write(data);
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                fitAddon.fit();
            });
        }

        function toggleTerminal() {
            const terminal = document.getElementById('qemu-terminal');
            terminal.classList.toggle('hidden');
            
            if (!terminal.classList.contains('hidden') && fitAddon) {
                fitAddon.fit();
            }
        }

        function restartVM() {
            const qemuIframe = document.getElementById('qemu-iframe');
            const statusText = document.getElementById('status-text');
            const sessionStatus = document.getElementById('session-status');
            
            sessionStatus.classList.remove('hidden');
            statusText.textContent = 'Restarting VM...';
            
            // Reload the iframe to restart VM
            qemuIframe.src = qemuIframe.src;
            
            setTimeout(() => {
                sessionStatus.classList.add('hidden');
                if (term) {
                    term.clear();
                    term.writeln('QEMU WebAssembly Terminal');
                    term.writeln('========================');
                    term.writeln('VM restarted.');
                    term.writeln('');
                }
            }, 2000);
        }

        function closeVM() {
            const qemuContainer = document.getElementById('qemu-container');
            const qemuIframe = document.getElementById('qemu-iframe');
            const sessionStatus = document.getElementById('session-status');
            
            // Remove message handler
            window.removeEventListener('message', handleQemuMessage);
            
            // Clear iframe
            qemuIframe.src = '';
            
            // Dispose terminal
            if (term) {
                term.dispose();
                term = null;
                fitAddon = null;
            }
            
            // Hide container
            qemuContainer.classList.add('hidden');
            sessionStatus.classList.add('hidden');
            document.getElementById('launch-btn').disabled = false;
        }
    </script>
</body>
</html>
